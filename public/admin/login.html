<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>교수 로그인 · AI핀테크융합과 상담 예약</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="page-center">
  <main class="container container--narrow">
    <div class="card login-card">
      <p class="eyebrow" data-logo>AI핀테크융합과 | 한국폴리텍대학 서울강서캠퍼스</p>
      <h1 class="title">교수 로그인</h1>
      <p class="sub">상담 시간 관리와 예약 확인을 위해 로그인해 주세요.</p>
      <form id="loginForm" novalidate>
        <div class="field">
          <label for="email">이메일</label>
          <input id="email" name="email" type="email" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="password">비밀번호</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <p class="form-error" id="formError" role="alert" hidden></p>
        <button class="btn btn--primary btn--block" type="submit" id="submitBtn">로그인</button>
      </form>
      <p class="hint center"><a href="/">← 지원자 예약 화면으로</a></p>
    </div>
  </main>
  <script src="/js/api.js"></script>
  <script src="/js/admin-login.js"></script>
</body>
</html>
