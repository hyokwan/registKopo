<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>예약 완료 · AI핀테크융합과 상담 예약</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <header class="header">
    <div class="container header__inner">
      <a class="brand" href="/" data-logo>
        <span class="brand__dept">AI핀테크융합과</span><span class="brand__sep">|</span><span class="brand__campus">한국폴리텍대학 서울강서캠퍼스</span>
      </a>
    </div>
  </header>

  <main class="container page">
    <section id="doneView" hidden>
      <div class="done-hero">
        <div class="done-check" aria-hidden="true">✓</div>
        <h1 class="title">상담 예약이 완료됐어요</h1>
        <p class="sub">예약한 시간에 맞춰 방문해 주세요.</p>
      </div>

      <div class="code-box">
        <p class="code-box__label mt-0">예약번호</p>
        <p class="code-box__code" id="code"></p>
        <button type="button" class="btn btn--md" id="copyBtn">📋 예약번호 복사</button>
      </div>

      <section class="card mt-20" aria-label="예약 내용">
        <dl class="info">
          <dt>일시</dt><dd id="when"></dd>
          <dt>장소</dt><dd id="where"></dd>
          <dt>학과</dt><dd id="dept"></dd>
        </dl>
      </section>

      <p class="notice">ℹ️ <b>예약번호와 휴대폰 번호로 조회·취소할 수 있어요.</b> 예약번호를 캡처하거나 복사해 두세요.</p>
    </section>

    <section id="missingView" class="done-hero" hidden>
      <h1 class="title">예약 정보를 찾을 수 없어요</h1>
      <p class="sub">이미 예약하셨다면 휴대폰 번호와 예약번호로 확인할 수 있어요.</p>
    </section>
  </main>

  <div class="bottom-bar">
    <div class="container">
      <a class="btn" href="/">처음으로</a>
      <a class="btn btn--primary" href="/my.html" id="myLink">내 예약 확인</a>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/done.js"></script>
</body>
</html>
