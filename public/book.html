<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>시간 선택 · AI핀테크융합과 상담 예약</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <header class="header">
    <div class="container header__inner">
      <a class="brand" href="/" data-logo>
        <span class="brand__dept">AI핀테크융합과</span><span class="brand__sep">|</span><span class="brand__campus">한국폴리텍대학 서울강서캠퍼스</span>
      </a>
    </div>
  </header>

  <main class="container page">
    <a class="back-link" href="/">‹ 처음으로</a>
    <ol class="steps mt-6" aria-label="1단계 / 3단계"><li class="is-done"></li><li></li><li></li></ol>

    <!-- 학과 선택 (학과가 2개 이상일 때만) -->
    <section id="deptView" hidden>
      <h1 class="title">어느 학과와 상담할까요?</h1>
      <div class="dept-list" id="deptList"></div>
    </section>

    <!-- 시간 선택 -->
    <section id="timeView" hidden>
      <h1 class="title">언제 방문하시겠어요?</h1>
      <p class="sub" id="deptName"></p>

      <div class="week-bar">
        <button type="button" class="icon-btn" id="prevWeek" aria-label="이전 주">‹</button>
        <h2 class="week-bar__label" id="weekLabel" aria-live="polite">&nbsp;</h2>
        <button type="button" class="icon-btn" id="nextWeek" aria-label="다음 주">›</button>
      </div>
      <div class="date-scroll" id="dates" role="group" aria-label="날짜 선택"></div>

      <h2 class="section-title mt-20" id="timesTitle">시간 선택</h2>
      <div id="times" aria-live="polite"></div>
      <p class="selected-hint" id="selectedHint"></p>
    </section>
  </main>

  <div class="bottom-bar">
    <div class="container">
      <button type="button" class="btn btn--primary" id="nextBtn" disabled>다음</button>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/book.js"></script>
</body>
</html>
